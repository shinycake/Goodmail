# The Linux scripts/check (docs/setup/cloud-builds.md): lint, every package and its tests compiled for iOS, the app
# and extension targets type-checked, and the Linux-testable packages' tests. review.yml runs it on each PR merged
# with main, which the merge queue requires, and check.yml on main. It needs the private goodmail-sdk repository, read with the GOODMAIL_SDK_DEPLOY_KEY secret.
# Until that secret exists, it runs only the lint and the line cap (scripts/check --lint).
name: linux-check

on:
  workflow_call:
    secrets:
      GOODMAIL_SDK_DEPLOY_KEY:
        required: false

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    # The image's Swift is the one Xcode ships with, so setup doesn't download its own.
    container: swift:6.4.2-noble
    timeout-minutes: 45
    permissions:
      contents: read
    # The image's default shell is sh; scripts and these steps expect bash.
    defaults:
      run:
        shell: bash
    env:
      # Actions sets HOME to /github/home, but xtool installs the SDK in the passwd home (/root), so align the two.
      HOME: /root
      HAS_SDK_KEY: ${{ secrets.GOODMAIL_SDK_DEPLOY_KEY != '' }}
    steps:
      # The toolchain action puts goodmail-sdk next to this repository, as in a cloud session.
      - uses: actions/checkout@v4
        with:
          path: goodmail
      - name: Trust the checkout
        working-directory: goodmail
        run: git config --global --add safe.directory "$PWD"

      - uses: ./goodmail/.github/actions/linux-toolchain
        with:
          sdk-key: ${{ secrets.GOODMAIL_SDK_DEPLOY_KEY }}

      - name: scripts/check
        if: env.HAS_SDK_KEY == 'true'
        working-directory: goodmail
        run: scripts/check

      - name: scripts/check --lint (no GOODMAIL_SDK_DEPLOY_KEY secret yet, so no iOS compile or tests)
        if: env.HAS_SDK_KEY != 'true'
        working-directory: goodmail
        run: |
          echo "::warning::GOODMAIL_SDK_DEPLOY_KEY isn't set, so this ran only the lint. See docs/setup/cloud-builds.md."
          scripts/check --lint
