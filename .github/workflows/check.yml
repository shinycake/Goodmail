# The Linux scripts/check on main after merges, to catch what two PRs that were each green break together. Pull
# requests run the same check inside review.yml, where it gates the merge (ADR-016).
name: check

on:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    uses: ./.github/workflows/linux-check.yml
    permissions:
      contents: read
    secrets:
      GOODMAIL_SDK_DEPLOY_KEY: ${{ secrets.GOODMAIL_SDK_DEPLOY_KEY }}
