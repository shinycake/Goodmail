# Lint on main after merges. Pull requests get the same lint inside review.yml, where it gates the merge (ADR-016).
name: check

on:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - name: Format and line cap
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/check --lint
