# The PR pipeline (ADR-016): the Linux scripts/check, a Claude review against docs/review.md, then a squash merge of
# the exact commit that passed both. If main moved after the check, the merge job checks the PR merged with the new
# main itself, so a busy main never sends an approved PR back for another push. A push that only takes in main keeps
# its approval, because the review is keyed on the PR's own changes. This workflow is the gate.
name: review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push cancels the review of the old one, so only the newest commit can merge.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

# The repository is public. Pull requests from forks get no secrets, so they can't be checked against the SDK,
# reviewed or merged; every job runs only for branches of this repository, which only the owner can push.
jobs:
  # Lint, the iOS compile of everything, and the Linux tests, on the PR merged with main (linux-check.yml).
  check:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/linux-check.yml
    permissions:
      contents: read
    secrets:
      GOODMAIL_SDK_DEPLOY_KEY: ${{ secrets.GOODMAIL_SDK_DEPLOY_KEY }}

  claude:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # An approval belongs to the PR's own changes: its diff from where it meets main, by `git patch-id`, which
      # ignores line numbers. A push that only merges main in leaves that unchanged, so the earlier approval stands.
      # Only this workflow's token posts the approval marker, as github-actions[bot].
      - id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changes=$(git diff "origin/$GITHUB_BASE_REF...$HEAD_SHA" | git patch-id --stable | cut -d' ' -f1)
          echo "changes=$changes" >>"$GITHUB_OUTPUT"
          [[ -n "$changes" ]] || exit 0
          markers=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body')
          if grep -qF "<!-- approved-changes: $changes -->" <<<"$markers"; then
            echo "These changes were already approved; only main moved since. Skipping the review."
            echo "approved=true" >>"$GITHUB_OUTPUT"
          fi

      - id: review
        if: steps.prior.outputs.approved != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: origin/${{ github.event.pull_request.base.ref }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            You are the merge gate for this PR. Nothing merges unless you approve it.

            1. Read CLAUDE.md and docs/review.md in full. docs/review.md is the standard you enforce.
            2. Read the diff (`gh pr diff`, `git diff BASE...HEAD`) and the PR description, then read every changed
               file in full, plus the code it calls and is called by, until you understand the change.
            3. Review it against docs/review.md. Implicit state machines, files over 1000 lines, correctness bugs,
               and the code-quality blockers listed there all block approval.
            4. Post each blocking finding as an inline comment on the line it is about, written as prose that names
               the problem, the evidence, and the remedy. Post non-blocking suggestions only if they are worth the
               author's time.
            5. Post one summary comment with `gh pr comment`. Start it with "**Claude review: approved**" or
               "**Claude review: changes requested**", then list the blocking findings in a sentence each.
            6. Return the verdict: "approve" only if there are no blocking findings.

            If this PR changes docs/review.md, CLAUDE.md or .github/, review it against the standard on the base
            branch (`git show BASE:docs/review.md`), not the PR's copy.
          claude_args: |
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(wc:*),Read,Grep,Glob"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","request_changes"]},"blocking_findings":{"type":"integer","minimum":0}},"required":["verdict","blocking_findings"]}'

      - name: Enforce the verdict
        if: steps.prior.outputs.approved != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGES: ${{ steps.prior.outputs.changes }}
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          verdict=$(jq -r '.verdict' <<<"$RESULT")
          echo "Verdict: $verdict ($(jq -r '.blocking_findings' <<<"$RESULT") blocking findings)"
          [[ "$verdict" == "approve" ]]
          if [[ -n "$CHANGES" ]]; then
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" \
              --body "Approval recorded for these changes. Merging main in won't need another review. <!-- approved-changes: $CHANGES -->"
          fi

  merge:
    needs: [check, claude]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # The same image as the check, so it can check again when main moves.
    container: swift:6.4.2-noble
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    env:
      HOME: /root
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      TESTED_BASE: ${{ needs.check.outputs.base }}
      HAS_SDK_KEY: ${{ secrets.GOODMAIL_SDK_DEPLOY_KEY != '' }}
      AUTHOR_ID: ${{ github.event.pull_request.user.id }}
      AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Tools
        run: apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y -q gh jq

      - id: gate
        name: Hold and .github
        run: |
          labels=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(",")')
          if [[ ",$labels," == *",hold,"* ]]; then
            echo "Labeled hold; leaving it for the owner."
            exit 0
          fi
          if gh pr diff "$PR" -R "$GITHUB_REPOSITORY" --name-only | grep -q '^\.github/'; then
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" \
              --body "Approved and green, but this PR changes .github/, which controls the gate itself. The owner merges it."
            exit 0
          fi
          echo "merge=true" >>"$GITHUB_OUTPUT"

      - if: steps.gate.outputs.merge == 'true'
        uses: actions/checkout@v4
        with:
          path: goodmail
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Installed up front, so a move of main can be checked at once.
      - if: steps.gate.outputs.merge == 'true'
        uses: ./goodmail/.github/actions/linux-toolchain
        with:
          sdk-key: ${{ secrets.GOODMAIL_SDK_DEPLOY_KEY }}

      # The check passed on this PR merged with main at TESTED_BASE. Merge only while main is still that commit. If
      # main moved, check the PR merged with the new main here and try again, a few times, before giving up.
      - if: steps.gate.outputs.merge == 'true'
        name: Squash-merge the reviewed commit
        working-directory: goodmail
        run: |
          git config --global --add safe.directory "$PWD"
          tested="$TESTED_BASE"
          for attempt in 1 2 3 4; do
            main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [[ "$main" == "$tested" ]]; then
              # The squash commit is authored with a noreply address, so public history never carries a personal
              # email. GitHub takes only an address of the account that merges: the PR author's noreply address
              # works once that account keeps its email private, and this workflow's bot address always does.
              # Merging without one would author the commit with the account's default email, so it never does.
              # From outside the checkout, so gh deletes only the remote branch.
              for email in "$AUTHOR_ID+$AUTHOR_LOGIN@users.noreply.github.com" \
                "41898282+github-actions[bot]@users.noreply.github.com"; do
                if (cd / && gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --squash --delete-branch \
                  --match-head-commit "$SHA" --author-email "$email"); then
                  exit 0
                fi
              done
              exit 1
            fi
            echo "▸ main moved from ${tested:0:7} to ${main:0:7}; checking the PR merged with it (attempt $attempt)"
            git fetch -q origin main
            git checkout -q --detach "$SHA"
            if ! git -c user.name=review -c user.email=review@localhost merge -q --no-edit "$main"; then
              gh pr comment "$PR" -R "$GITHUB_REPOSITORY" \
                --body "Approved, but it conflicts with main at ${main:0:7}. Merge main into the branch and push."
              exit 1
            fi
            if [[ "$HAS_SDK_KEY" == true ]]; then check=(scripts/check); else check=(scripts/check --lint); fi
            if ! "${check[@]}"; then
              gh pr comment "$PR" -R "$GITHUB_REPOSITORY" \
                --body "Approved, but scripts/check fails on it merged with main at ${main:0:7}. See the merge job's log."
              exit 1
            fi
            tested="$main"
          done
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" \
            --body "Approved and green, but main kept moving during four checks. Push again, or rerun this job, to retry."
          exit 1
