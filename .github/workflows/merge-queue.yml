# The merge queue (docs/setup/merge-queue.md, ADR-020): lands every PR the Claude review approved and scripts/check
# passed, one at a time, with nobody watching. review.yml only checks and reviews; this workflow merges.
#
# A sweep plans (which PR is next, and where every other one stands), verifies the next PR squashed onto the current
# main, checking it again only if main moved since its review run checked it, and lands it by fast-forwarding main.
# Then it starts the next sweep, until no PR is left to merge. Every PR's place in the queue is its `merge-queue`
# commit status, and each sweep's summary lists them all.
name: merge-queue

on:
  # A review run finished: a PR may have become ready, or failed and need a rerun.
  workflow_run:
    workflows: [review]
    types: [completed]
  # Picks up a label that came off, a run that never reported, or a sweep that didn't finish.
  schedule:
    - cron: "*/10 * * * *"
  # The previous sweep merged a PR or settled why it can't, so the next one goes.
  workflow_dispatch:

# One sweep at a time, so only the queue moves main between its check and its push. GitHub keeps one more pending and
# drops older pending ones, which loses nothing: every sweep looks at every PR.
concurrency:
  group: merge-queue
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # rerun a failed review run
      contents: read
      pull-requests: write # comment on a stuck PR
      issues: write
      statuses: write # each PR's merge-queue status
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      pr: ${{ steps.plan.outputs.pr }}
      sha: ${{ steps.plan.outputs.sha }}
      ref: ${{ steps.plan.outputs.ref }}
      tree: ${{ steps.plan.outputs.tree }}
      author_id: ${{ steps.plan.outputs.author_id }}
      author_login: ${{ steps.plan.outputs.author_login }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github
      - id: plan
        run: .github/merge-queue/plan

  # Runs the PR's code, so it gets read access only.
  verify:
    needs: plan
    if: ${{ needs.plan.outputs.pr != '' }}
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      HOME: /root
      PR: ${{ needs.plan.outputs.pr }}
      SHA: ${{ needs.plan.outputs.sha }}
      CHECKED_TREE: ${{ needs.plan.outputs.tree }}
      HAS_SDK_KEY: ${{ secrets.GOODMAIL_SDK_DEPLOY_KEY != '' }}
    outputs:
      main: ${{ steps.squash.outputs.main }}
      tree: ${{ steps.squash.outputs.tree }}
      verdict: ${{ steps.check.outputs.state || steps.squash.outputs.state }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: goodmail
          ref: main
          fetch-depth: 0
      - id: squash
        working-directory: goodmail
        run: .github/merge-queue/verify squash
      - if: steps.squash.outputs.state == 'unverified'
        uses: ./goodmail/.github/actions/linux-toolchain
        with:
          sdk-key: ${{ secrets.GOODMAIL_SDK_DEPLOY_KEY }}
      - id: check
        if: steps.squash.outputs.state == 'unverified'
        working-directory: goodmail
        run: .github/merge-queue/verify check

  land:
    needs: [plan, verify]
    if: ${{ always() && needs.plan.outputs.pr != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # start the next sweep
      contents: write # fast-forward main
      pull-requests: write
      issues: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ needs.plan.outputs.pr }}
      SHA: ${{ needs.plan.outputs.sha }}
      REF: ${{ needs.plan.outputs.ref }}
      AUTHOR_ID: ${{ needs.plan.outputs.author_id }}
      AUTHOR_LOGIN: ${{ needs.plan.outputs.author_login }}
      MAIN: ${{ needs.verify.outputs.main }}
      TREE: ${{ needs.verify.outputs.tree }}
      VERDICT: ${{ needs.verify.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: .github/merge-queue/land
