name = "goodmail-push"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Secrets are not here. Set them with `wrangler secret put` (see README.md): APNS_PRIVATE_KEY, EMAIL_HMAC_SECRET.
[vars]
OUTLOOK_CLIENT_ID = "aedf9c24-b8ba-4a4e-bb1a-cc594dec2bab"
GOOGLE_CLIENT_ID = "847337870740-fpj7hd07nfsueispeug4nell21pf3vi2.apps.googleusercontent.com"
# Must match the push subscription's audience.
PUBSUB_AUDIENCE = "https://goodmail-push.goodmail-push-worker.workers.dev/v1/pubsub"
PUBSUB_SERVICE_ACCOUNT = "gmail-push-invoker@goodmail-ios.iam.gserviceaccount.com"
APNS_TOPIC = "com.idanbirman.goodmail"
APNS_KEY_ID = "7H5XJ46XVH"
APNS_TEAM_ID = "72D8U72V55"
# App Attest (src/attest-routes.ts): "observe" only logs requests the genuine app didn't sign; "enforce" refuses them.
APP_ATTEST = "observe"

[[d1_databases]]
binding = "DB"
database_name = "goodmail-push"
# From `wrangler d1 create goodmail-push`.
database_id = "b56927bb-7405-4dbf-a571-6da65ec30b6b"
migrations_dir = "migrations"

# iCloud and other IMAP accounts: every 5 minutes a run logs in to each watched Inbox and holds IDLE until the next (src/imap-poll.ts).
[triggers]
crons = ["*/5 * * * *"]

# Registering an IMAP watch logs in to check it; this caps those checks per client address.
[[ratelimits]]
name = "IMAP_LOGIN_CHECKS"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Each install asks for one App Attest challenge; this caps them per client address.
[[ratelimits]]
name = "ATTEST_CHALLENGES"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
